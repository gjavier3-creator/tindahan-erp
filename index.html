<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tindahan ERP</title>
<meta name="theme-color" content="#22303F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tindahan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
  <div>
    <div class="store-name display">🏪 <input id="storeNameInput" value="Tindahan"></div>
    <div class="date" id="dateLabel"></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="badge mono" id="headerBadge">₱0</div>
    <button id="testModeBtn" class="icon-btn" style="display:none;color:var(--paper);" title="Toggle Test Mode">🧪</button>
    <button id="switchUserBtn" class="icon-btn" style="display:none;color:var(--paper);" title="Switch user">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar"></nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<!-- Firebase bootstrap: sets up window.fsGet/fsSet, used by the storage layer in app.js.
     Must run BEFORE app.js, and both are type="module" so the browser guarantees that
     order regardless of load timing. -->
<script type="module" src="firebase-init.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
